[package]
name = "zban"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A file-based issue tracker for you and your coding agents: Markdown issues in your repository, managed through a CLI and MCP server"
license = "MIT OR Apache-2.0"
repository = "https://github.com/convesoft/zban"
readme = "README.md"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
petgraph = { version = "0.8.3", default-features = false, features = ["std", "graphmap"] }
rmcp = { version = "3.9.0", default-features = false, features = ["server", "transport-io"] }
saphyr-parser = "0.3.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.1", features = ["rt"] }

[dev-dependencies]
tempfile = "3.27.0"
