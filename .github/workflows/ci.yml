name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain that rust-toolchain.toml pins (ADR-RUST-BINARY).
      - run: rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux on x86_64 and macOS on aarch64, the platforms of ADR-RUST-BINARY.
        # macOS uses the image that release.yml builds on.
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: cargo test --locked

  minimum-rust:
    # Tests with the oldest Rust that Cargo.toml declares as `rust-version`,
    # which overrides the pin of rust-toolchain.toml (ADR-RUST-BINARY).
    name: Test (minimum Rust version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the rust-version of Cargo.toml
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["rust-version"])')
          rustup toolchain install "$version" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"
      - run: cargo test --locked
