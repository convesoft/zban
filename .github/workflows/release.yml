# Tests zban, builds the release binaries (ADR-RUST-BINARY), packs the npm
# packages (ADR-NPM-DISTRIBUTION) and publishes a release on workflow_dispatch
# (dry_run defaults to true). Pull requests that touch release inputs only test,
# build, pack and run the local smoke tests.
name: Release

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: npm dist-tag (for example latest for stable, next for release candidates)
        required: true
        default: latest
        type: string
      dry_run:
        description: Validate, build, pack, smoke-test and preview release without publishing or tagging
        required: false
        default: true
        type: boolean
  pull_request:
    paths:
      - .github/workflows/release.yml
      - rust-toolchain.toml
      - Cargo.toml
      - Cargo.lock
      - about.toml
      - about.hbs
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - nx.json
      - npm/**
      - scripts/package-npm.mjs

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare release metadata and main npm package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      dist_tag: ${{ steps.meta.outputs.dist_tag }}
    steps:
      - name: Check branch and inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_REF: ${{ github.ref }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          case "$GITHUB_REF" in
            refs/heads/main | refs/heads/release/*) ;;
            *)
              echo "::error::Release must run from main or a release/* branch (got $GITHUB_REF)."
              exit 1
              ;;
          esac

          if ! [[ "$DIST_TAG" =~ ^[a-z0-9][a-z0-9._-]*$ ]]; then
            echo "::error::Invalid npm dist-tag: $DIST_TAG"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - run: rustup toolchain install

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Read and validate version from Cargo.toml
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          DIST_TAG: ${{ inputs.dist_tag || 'latest' }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          semver_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
          if ! [[ "$version" =~ $semver_re ]] || [ "$version" = "0.0.0" ]; then
            echo "::error::Invalid version in Cargo.toml: $version"
            exit 1
          fi
          tag="v$version"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
              echo "::error::Git tag $tag already exists. Bump Cargo.toml with pnpm nx release version first."
              exit 1
            fi
            if npm view "@convesoft/zban@$version" version > /dev/null 2>&1; then
              echo "::error::@convesoft/zban@$version is already published on npm."
              exit 1
            fi
          fi

          {
            echo "sha=$sha"
            echo "version=$version"
            echo "tag=$tag"
            echo "dist_tag=$DIST_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Pack main npm package (@convesoft/zban)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dist"
          pkg_dir=$(node scripts/package-npm.mjs main "$RUNNER_TEMP/npm-stage")
          npm pack "$pkg_dir" --pack-destination "$RUNNER_TEMP/dist"
          tarball="$RUNNER_TEMP/dist/convesoft-zban-$VERSION.tgz"
          test -f "$tarball"
          # The package also holds every file of docs/, as it is (ADR-NPM-DISTRIBUTION).
          listing=$(tar -tzf "$tarball")
          mapfile -t docs < <(find docs -type f | LC_ALL=C sort)
          for required in package/package.json package/bin/zban.cjs package/README.md package/LICENSE-MIT package/LICENSE-APACHE package/docs/index.mara.md "${docs[@]/#/package/}"; do
            if ! grep -Fxq -- "$required" <<< "$listing"; then
              echo "::error::$required is missing from @convesoft/zban"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: zban-npm-main
          path: ${{ runner.temp }}/dist/convesoft-zban-*.tgz
          if-no-files-found: error

  build:
    name: Build (${{ join(matrix.targets, ', ') }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each entry builds its targets one after the other on one runner, and
          # the first target is the runner's own. Linux builds natively on each
          # architecture. macOS runners are scarce, so one Apple silicon runner
          # builds both macOS targets, cross-compiling for x86_64.
          - os: ubuntu-24.04
            targets: [x86_64-unknown-linux-musl]
            native_npm_pkg: convesoft-zban-linux-x64
          - os: ubuntu-24.04-arm
            targets: [aarch64-unknown-linux-musl]
            native_npm_pkg: convesoft-zban-linux-arm64
          - os: macos-15
            targets: [aarch64-apple-darwin, x86_64-apple-darwin]
            native_npm_pkg: convesoft-zban-darwin-arm64
    runs-on: ${{ matrix.os }}
    env:
      TARGETS: ${{ join(matrix.targets, ' ') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      # Installs the toolchain that rust-toolchain.toml pins, with all four
      # release targets (ADR-RUST-BINARY).
      - run: rustup toolchain install
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Build
        run: |
          for target in $TARGETS; do
            cargo build --release --locked --target "$target"
          done
      # Runs the test suite on the commit being released, for the target the
      # runner runs natively: the first of its entry.
      - name: Test
        run: cargo test --locked --target ${{ matrix.targets[0] }}
      # Runs the main commands in a scratch project outside the checkout, so
      # that zban cannot find this repository's own `.zban/`. The Apple silicon
      # runner runs the x86_64 binary under Rosetta 2, which the image has. If
      # Rosetta is missing and cannot be installed, that binary is not
      # smoke-tested, rather than failing the release.
      - name: Smoke-test the binaries
        shell: bash
        run: |
          for target in $TARGETS; do
            if [ "$target" = x86_64-apple-darwin ] && ! arch -x86_64 /usr/bin/true; then
              sudo softwareupdate --install-rosetta --agree-to-license || true
              if ! arch -x86_64 /usr/bin/true; then
                echo "::warning::Rosetta 2 is unavailable, so $target is not smoke-tested"
                continue
              fi
            fi
            zban="$GITHUB_WORKSPACE/target/$target/release/zban"
            "$zban" --version
            mkdir "$RUNNER_TEMP/smoke-$target"
            (
              cd "$RUNNER_TEMP/smoke-$target"
              "$zban" init
              "$zban" create "Smoke test" --type task --body "- [ ] Run zban"
              id=$(basename .zban/*.md .md)
              "$zban" list | grep -F "$id"
              "$zban" update "$id" --replace-old "- [ ] Run zban" --replace-new "- [x] Run zban" --status "done"
              test -f ".zban/archive/$id.md"
              "$zban" list --status "done" | grep -F "$id"
              "$zban" check
            )
          done
      # Writes the licenses of the crates compiled into zban for each target,
      # from about.toml and about.hbs, into the directory its archive is packed
      # from. cargo-about is not cached: a release should not ship notices
      # written by a binary restored from a cache.
      - name: Write the third-party licenses
        shell: bash
        run: |
          cargo install --locked cargo-about --version 0.9.3 --features cli
          for target in $TARGETS; do
            mkdir -p "$RUNNER_TEMP/zban-$target"
            cargo about generate --locked --fail --target "$target" \
              --output-file "$RUNNER_TEMP/zban-$target/THIRD-PARTY-LICENSES" about.hbs 2>&1 | tee "$RUNNER_TEMP/cargo-about-$target.log"
            # A license file that no longer matches its checksum in about.toml
            # only draws a warning, and its crate gets the license's generic text.
            if grep -F WARN "$RUNNER_TEMP/cargo-about-$target.log"; then
              echo "::error::cargo-about warned about a license for $target; review about.toml"
              exit 1
            fi
          done
      - name: Package release archives and platform npm packages
        shell: bash
        env:
          # Keeps macOS tar from adding AppleDouble `._` files.
          COPYFILE_DISABLE: 1
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in $TARGETS; do
            staging="$RUNNER_TEMP/zban-$target"
            cp "target/$target/release/zban" README.md LICENSE-MIT LICENSE-APACHE "$staging"
            tar -czf "dist/zban-$target.tar.gz" -C "$staging" zban README.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES
            tar -tzf "dist/zban-$target.tar.gz" | grep -Fx THIRD-PARTY-LICENSES

            pkg_dir=$(node scripts/package-npm.mjs platform "$target" "target/$target/release/zban" "$staging/THIRD-PARTY-LICENSES" "$RUNNER_TEMP/npm-stage")
            npm pack "$pkg_dir" --pack-destination dist
          done
      - uses: actions/download-artifact@v8
        with:
          name: zban-npm-main
          path: ${{ runner.temp }}/npm-main
      - name: Smoke-test packed npm packages locally
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          NATIVE_NPM_PKG: ${{ matrix.native_npm_pkg }}
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/npm-smoke"
          mkdir -p "$smoke/install" "$smoke/work"
          platform_tgz="$GITHUB_WORKSPACE/dist/$NATIVE_NPM_PKG-$VERSION.tgz"
          main_tgz="$RUNNER_TEMP/npm-main/convesoft-zban-$VERSION.tgz"
          test -f "$platform_tgz"
          test -f "$main_tgz"
          (
            cd "$smoke/install"
            npm init -y > /dev/null
            # Install platform package first, then unpack the dispatcher without
            # consulting the registry for unpublished optionalDependencies.
            npm install --no-audit --no-fund --ignore-scripts --omit=optional "$main_tgz"
            npm install --no-audit --no-fund --ignore-scripts "$platform_tgz"
          )
          (
            cd "$smoke/work"
            "$smoke/install/node_modules/.bin/zban" --version | grep -Fx "zban $VERSION"
            "$smoke/install/node_modules/.bin/zban" init
            "$smoke/install/node_modules/.bin/zban" check
          )
      - uses: actions/upload-artifact@v7
        with:
          name: zban-${{ matrix.os }}
          path: |
            dist/zban-*.tar.gz
            dist/convesoft-zban-*.tgz
          if-no-files-found: error

  publish:
    name: Publish to npm and create GitHub Release
    needs: [prepare, build]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: npm
      url: https://www.npmjs.com/package/@convesoft/zban/v/${{ needs.prepare.outputs.version }}
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      DIST_TAG: ${{ needs.prepare.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      # nx-rust asks Cargo for the workspace graph when nx release changelog runs.
      - run: rustup toolchain install

      - uses: pnpm/action-setup@v6
      # Omit `registry-url` so setup-node does not write a NODE_AUTH_TOKEN line
      # into `.npmrc`, which would interfere with npm OIDC Trusted Publishing.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          pattern: zban-*
          path: dist
          merge-multiple: true

      - name: Verify artifact inventory and write checksums
        run: |
          set -euo pipefail
          for target in \
            x86_64-unknown-linux-musl \
            aarch64-unknown-linux-musl \
            aarch64-apple-darwin \
            x86_64-apple-darwin
          do
            test -f "dist/zban-$target.tar.gz"
          done
          for pkg in \
            convesoft-zban \
            convesoft-zban-linux-x64 \
            convesoft-zban-linux-arm64 \
            convesoft-zban-darwin-arm64 \
            convesoft-zban-darwin-x64
          do
            test -f "dist/$pkg-$VERSION.tgz"
          done
          (cd dist && sha256sum zban-*.tar.gz > SHA256SUMS && cat SHA256SUMS)

      - name: Publish to npm (dry run)
        if: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          npm --version
          for pkg in \
            convesoft-zban-linux-x64 \
            convesoft-zban-linux-arm64 \
            convesoft-zban-darwin-arm64 \
            convesoft-zban-darwin-x64 \
            convesoft-zban
          do
            npm publish "dist/$pkg-$VERSION.tgz" --dry-run --access public --tag "$DIST_TAG"
          done

      - name: Preview GitHub Release notes (dry run)
        if: ${{ inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm nx release changelog "$VERSION" --dry-run

      - name: Publish platform npm packages via OIDC Trusted Publishing
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          npm --version

          publish_or_verify() {
            local package_name=$1
            local tarball=$2
            local expected actual
            expected=$(sha1sum "$tarball" | cut -d ' ' -f 1)
            if actual=$(npm view "$package_name@$VERSION" dist.shasum --json 2>/dev/null \
              | tr -d '"[:space:]'); then
              if [ "$actual" != "$expected" ]; then
                echo "::error::$package_name@$VERSION already exists on npm with a different shasum ($actual != $expected)"
                exit 1
              fi
              echo "$package_name@$VERSION already matches $expected"
            else
              npm publish "$tarball" --access public --provenance --tag "$DIST_TAG"
            fi
          }

          for package_name in \
            @convesoft/zban-linux-x64 \
            @convesoft/zban-linux-arm64 \
            @convesoft/zban-darwin-arm64 \
            @convesoft/zban-darwin-x64
          do
            slug=${package_name#@convesoft/}
            publish_or_verify "$package_name" "dist/convesoft-$slug-$VERSION.tgz"
          done

      - name: Wait for platform npm packages to become visible
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            missing=0
            for package_name in \
              @convesoft/zban-linux-x64 \
              @convesoft/zban-linux-arm64 \
              @convesoft/zban-darwin-arm64 \
              @convesoft/zban-darwin-x64
            do
              npm view "$package_name@$VERSION" version > /dev/null 2>&1 || missing=1
            done
            if [ "$missing" -eq 0 ]; then
              exit 0
            fi
            echo "Platform packages still propagating on npm (attempt $attempt/60)"
            sleep 30
          done
          echo "::error::Platform packages did not become visible on npm within 30 minutes"
          exit 1

      - name: Publish main npm package (@convesoft/zban) via OIDC Trusted Publishing
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          tarball="dist/convesoft-zban-$VERSION.tgz"
          expected=$(sha1sum "$tarball" | cut -d ' ' -f 1)
          if actual=$(npm view "@convesoft/zban@$VERSION" dist.shasum --json 2>/dev/null \
            | tr -d '"[:space:]'); then
            if [ "$actual" != "$expected" ]; then
              echo "::error::@convesoft/zban@$VERSION already exists on npm with a different shasum ($actual != $expected)"
              exit 1
            fi
            echo "@convesoft/zban@$VERSION already matches $expected"
          else
            npm publish "$tarball" --access public --provenance --tag "$DIST_TAG"
          fi

      - name: Public npm registry smoke test
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if npm view "@convesoft/zban@$VERSION" version > /dev/null 2>&1; then
              tmp=$(mktemp -d)
              trap 'rm -rf -- "$tmp"' EXIT
              (
                cd "$tmp"
                npx --yes "@convesoft/zban@$VERSION" --version | grep -Fx "zban $VERSION"
              )
              exit 0
            fi
            echo "@convesoft/zban@$VERSION still propagating on npm (attempt $attempt/60)"
            sleep 30
          done
          echo "::error::@convesoft/zban@$VERSION did not become visible on npm within 30 minutes"
          exit 1

      - name: Create git tag and GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm nx release changelog "$VERSION" --git-push-args="refs/tags/$TAG"

      - name: Upload release archives and checksums to GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/zban-*.tar.gz dist/SHA256SUMS --clobber
