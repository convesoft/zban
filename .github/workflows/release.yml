# Tests zban and builds the release binaries of ADR-RUST-BINARY. A pushed `v*`
# tag on a commit of `main` also creates the GitHub release; pull requests that
# change this workflow or the dependencies, and manual runs, only test and build.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Cargo.toml
      - Cargo.lock
      - about.toml
      - about.hbs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds natively on each architecture. Apple silicon runners
          # build both macOS targets, cross-compiling for x86_64.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            native: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            native: true
          - target: x86_64-apple-darwin
            os: macos-15
            native: false
          - target: aarch64-apple-darwin
            os: macos-15
            native: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so that a tag run can check that its commit is on main.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check that the tag names the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
      - name: Check that the tagged commit is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at $(git rev-parse HEAD), which is not on main"
            exit 1
          fi
      - run: cargo build --release --locked --target ${{ matrix.target }}
      # Runs the test suite on the commit being released, for each target it
      # ships whose binary the runner can run: the cross-compiled entry shares
      # its runner with a native one.
      - name: Test
        if: matrix.native
        run: cargo test --locked --target ${{ matrix.target }}
      # Runs the main commands in a scratch project outside the checkout, so
      # that zban cannot find this repository's own `.zban/`.
      - name: Smoke-test the binary
        if: matrix.native
        shell: bash
        env:
          ZBAN: ${{ github.workspace }}/target/${{ matrix.target }}/release/zban
        run: |
          "$ZBAN" --version
          mkdir "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          "$ZBAN" init
          "$ZBAN" create "Smoke test" --type task --body "- [ ] Run zban"
          id=$(basename .zban/*.md .md)
          "$ZBAN" list | grep -F "$id"
          "$ZBAN" update "$id" --replace-old "- [ ] Run zban" --replace-new "- [x] Run zban" --status done
          test -f ".zban/archive/$id.md"
          "$ZBAN" list --status done | grep -F "$id"
          "$ZBAN" check
      # Writes the licenses of the crates compiled into zban, from about.toml and
      # about.hbs. cargo-about is not cached: a tag run cannot restore the caches
      # of pull request runs, and a release should not ship notices written by a
      # binary restored from a cache.
      - name: Write the third-party licenses
        shell: bash
        run: |
          cargo install --locked cargo-about --version 0.9.3 --features cli
          cargo about generate --locked --fail --target ${{ matrix.target }} \
            --output-file THIRD-PARTY-LICENSES about.hbs 2>&1 | tee "$RUNNER_TEMP/cargo-about.log"
          # A license file that no longer matches its checksum in about.toml
          # only draws a warning, and its crate gets the license's generic text.
          if grep -F WARN "$RUNNER_TEMP/cargo-about.log"; then
            echo "::error::cargo-about warned about a license; review about.toml"
            exit 1
          fi
      - name: Package
        env:
          # Keeps macOS tar from adding AppleDouble `._` files.
          COPYFILE_DISABLE: 1
        run: |
          staging="$RUNNER_TEMP/zban-${{ matrix.target }}"
          mkdir -p "$staging" dist
          cp target/${{ matrix.target }}/release/zban README.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES "$staging"
          tar -czf dist/zban-${{ matrix.target }}.tar.gz -C "$staging" zban README.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES
          tar -tzf dist/zban-${{ matrix.target }}.tar.gz | grep -Fx THIRD-PARTY-LICENSES
      - uses: actions/upload-artifact@v7
        with:
          name: zban-${{ matrix.target }}
          path: dist/zban-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: Create the GitHub release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: zban-*
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: sha256sum zban-*.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --verify-tag
          --title "zban $GITHUB_REF_NAME" --generate-notes
