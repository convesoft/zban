# Tests zban and builds the release binaries of ADR-RUST-BINARY. A pushed `v*`
# tag on a commit of `main` also creates the GitHub release; pull requests that
# change this workflow, the toolchain or the dependencies, and manual runs, only
# test and build.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - rust-toolchain.toml
      - Cargo.toml
      - Cargo.lock
      - about.toml
      - about.hbs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ join(matrix.targets, ', ') }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each entry builds its targets one after the other on one runner, and
          # the first target is the runner's own. Linux builds natively on each
          # architecture. macOS runners are scarce, so one Apple silicon runner
          # builds both macOS targets, cross-compiling for x86_64.
          - os: ubuntu-24.04
            targets: [x86_64-unknown-linux-musl]
          - os: ubuntu-24.04-arm
            targets: [aarch64-unknown-linux-musl]
          - os: macos-15
            targets: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: ${{ matrix.os }}
    env:
      TARGETS: ${{ join(matrix.targets, ' ') }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so that a tag run can check that its commit is on main.
          fetch-depth: 0
      # Installs the toolchain that rust-toolchain.toml pins, with all four
      # release targets (ADR-RUST-BINARY).
      - run: rustup toolchain install
      - name: Check that the tag names the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
      - name: Check that the tagged commit is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at $(git rev-parse HEAD), which is not on main"
            exit 1
          fi
      - name: Build
        run: |
          for target in $TARGETS; do
            cargo build --release --locked --target "$target"
          done
      # Runs the test suite on the commit being released, for the target the
      # runner runs natively: the first of its entry.
      - name: Test
        run: cargo test --locked --target ${{ matrix.targets[0] }}
      # Runs the main commands in a scratch project outside the checkout, so
      # that zban cannot find this repository's own `.zban/`. The Apple silicon
      # runner runs the x86_64 binary under Rosetta 2, which the image has. If
      # Rosetta is missing and cannot be installed, that binary is not
      # smoke-tested, rather than failing the release.
      - name: Smoke-test the binaries
        shell: bash
        run: |
          for target in $TARGETS; do
            if [ "$target" = x86_64-apple-darwin ] && ! arch -x86_64 /usr/bin/true; then
              sudo softwareupdate --install-rosetta --agree-to-license || true
              if ! arch -x86_64 /usr/bin/true; then
                echo "::warning::Rosetta 2 is unavailable, so $target is not smoke-tested"
                continue
              fi
            fi
            zban="$GITHUB_WORKSPACE/target/$target/release/zban"
            "$zban" --version
            mkdir "$RUNNER_TEMP/smoke-$target"
            (
              cd "$RUNNER_TEMP/smoke-$target"
              "$zban" init
              "$zban" create "Smoke test" --type task --body "- [ ] Run zban"
              id=$(basename .zban/*.md .md)
              "$zban" list | grep -F "$id"
              "$zban" update "$id" --replace-old "- [ ] Run zban" --replace-new "- [x] Run zban" --status done
              test -f ".zban/archive/$id.md"
              "$zban" list --status done | grep -F "$id"
              "$zban" check
            )
          done
      # Writes the licenses of the crates compiled into zban for each target,
      # from about.toml and about.hbs, into the directory its archive is packed
      # from. cargo-about is not cached: a tag run cannot restore the caches of
      # pull request runs, and a release should not ship notices written by a
      # binary restored from a cache.
      - name: Write the third-party licenses
        shell: bash
        run: |
          cargo install --locked cargo-about --version 0.9.3 --features cli
          for target in $TARGETS; do
            mkdir -p "$RUNNER_TEMP/zban-$target"
            cargo about generate --locked --fail --target "$target" \
              --output-file "$RUNNER_TEMP/zban-$target/THIRD-PARTY-LICENSES" about.hbs 2>&1 | tee "$RUNNER_TEMP/cargo-about-$target.log"
            # A license file that no longer matches its checksum in about.toml
            # only draws a warning, and its crate gets the license's generic text.
            if grep -F WARN "$RUNNER_TEMP/cargo-about-$target.log"; then
              echo "::error::cargo-about warned about a license for $target; review about.toml"
              exit 1
            fi
          done
      - name: Package
        env:
          # Keeps macOS tar from adding AppleDouble `._` files.
          COPYFILE_DISABLE: 1
        run: |
          mkdir dist
          for target in $TARGETS; do
            staging="$RUNNER_TEMP/zban-$target"
            cp "target/$target/release/zban" README.md LICENSE-MIT LICENSE-APACHE "$staging"
            tar -czf "dist/zban-$target.tar.gz" -C "$staging" zban README.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES
            tar -tzf "dist/zban-$target.tar.gz" | grep -Fx THIRD-PARTY-LICENSES
          done
      - uses: actions/upload-artifact@v7
        with:
          name: zban-${{ matrix.os }}
          path: dist/zban-*.tar.gz
          if-no-files-found: error

  release:
    name: Create the GitHub release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: zban-*
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: sha256sum zban-*.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --verify-tag
          --title "zban $GITHUB_REF_NAME" --generate-notes
