# Builds the release binaries of ADR-RUST-BINARY. A pushed `v*` tag also
# creates the GitHub release; pull requests that change this workflow or the
# dependencies, and manual runs, only build.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds natively on each architecture. Apple silicon runners
          # build both macOS targets, cross-compiling for x86_64.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            native: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            native: true
          - target: x86_64-apple-darwin
            os: macos-15
            native: false
          - target: aarch64-apple-darwin
            os: macos-15
            native: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check that the tag names the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Run the binary
        if: matrix.native
        run: target/${{ matrix.target }}/release/zban --version
      - name: Package
        env:
          # Keeps macOS tar from adding AppleDouble `._` files.
          COPYFILE_DISABLE: 1
        run: |
          staging="$RUNNER_TEMP/zban-${{ matrix.target }}"
          mkdir -p "$staging" dist
          cp target/${{ matrix.target }}/release/zban README.md LICENSE-MIT LICENSE-APACHE "$staging"
          tar -czf dist/zban-${{ matrix.target }}.tar.gz -C "$staging" zban README.md LICENSE-MIT LICENSE-APACHE
      - uses: actions/upload-artifact@v7
        with:
          name: zban-${{ matrix.target }}
          path: dist/zban-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: Create the GitHub release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: zban-*
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: sha256sum zban-*.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --verify-tag
          --title "zban $GITHUB_REF_NAME" --generate-notes
